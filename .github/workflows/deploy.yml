name: CI/CD & Deploy Backend to Dokploy

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test:
    name: Run Go Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Run Unit Tests
        run: go test -v -race ./...

  deploy:
    name: Deploy to Dokploy
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy Deployment Webhook
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK_URL" ]; then
            echo "DOKPLOY_WEBHOOK_URL secret belum diset di GitHub Secrets repository backend."
            echo "Setup: Dokploy -> Backend Application -> Deployments -> Webhook URL -> paste ke GitHub Secrets sebagai DOKPLOY_WEBHOOK_URL."
            exit 0
          fi
          echo "Triggering Dokploy deployment webhook..."
          curl -f -s -S -X POST "$DOKPLOY_WEBHOOK_URL"
          echo "Deployment berhasil ditrigger ke Dokploy."
